name: Mirror to Codeberg

on:
  push:
    branches: [main, master]

jobs:
  codeberg-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to Codeberg
        run: |
          # Configure Git with a dummy user for the push
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # Push to Codeberg using the secret token
          git push --prune --force "https://token:${{ secrets.CODEBERG_TOKEN }}@codeberg.org/kosh-project/server.git" "refs/remotes/origin/*:refs/heads/*" "refs/tags/*:refs/tags/*"
