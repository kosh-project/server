name: Deploy documentation to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          # Cache cargo registry, target directory, and built documentation
          shared-key: "rust-docs"
          
      - name: Build documentation
        # Generate docs in release mode without dependencies' docs (optional, but saves time if you don't need them)
        # Remove --no-deps if you want dependencies documentation included
        run: cargo doc --release --no-deps

      - name: Setup redirect
        # Cargo doc outputs into target/doc, but the main crate docs are under target/doc/webdav_server
        # GitHub pages serves the root of target/doc, so we need a redirect.
        run: echo '<meta http-equiv="refresh" content="0; url=webdav_server/index.html">' > target/doc/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire target/doc directory
          path: './target/doc'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
