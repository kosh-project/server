name: Feature Request
description: Suggest an idea or enhancement for Kosh
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an enhancement! Please describe your idea and how it aligns with Kosh's zero-knowledge and low-resource principles.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the problem or limitation you are addressing.
      placeholder: I'm always frustrated when [...]
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A detailed description of the feature or behavior you would like to see.
      placeholder: Describe your proposed design or API changes [...]
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or workarounds you have evaluated.

  - type: textarea
    id: hardware_impact
    attributes:
      label: Low-Resource Hardware Impact
      description: How will this feature perform on low-power hardware (e.g. 2GB RAM, mechanical HDD)? Does it introduce unbounded allocations or random disk seeks?
