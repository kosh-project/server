name: Feature Request
description: Propose an architecture enhancement or capability for Kosh
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe your proposal and how it aligns with Kosh's zero-knowledge and low-resource principles.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What limitation or operational pain point does this proposal address?
      placeholder: Describe the current limitation or problem...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Proposed architectural design, API changes, or subsystem modifications.
      placeholder: Describe the technical implementation in detail...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Alternative approaches or workarounds evaluated and why they were rejected.

  - type: textarea
    id: hardware_impact
    attributes:
      label: Low-Resource Hardware Impact
      description: How will this perform on low-power hardware (2 GB RAM, single mechanical HDD)? Does it introduce unbounded memory allocations or random disk seeks?
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Proposal Requirements
      options:
        - label: I searched existing issues and discussions to confirm this feature has not been proposed or rejected.
          required: true
        - label: This proposal preserves zero-knowledge invariants (plaintext bytes and filenames never visible to the server).
          required: true
