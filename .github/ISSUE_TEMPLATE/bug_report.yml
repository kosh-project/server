name: Bug Report
description: Report a bug or unintended behavior in Kosh
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Provide concrete reproduction steps, environment details, and terminal logs to help diagnose the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the observed behavior.
      placeholder: What went wrong?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact commands and steps to reproduce the behavior.
      placeholder: |
        1. Start the server: `cargo run -p server`
        2. Send request to ...
        3. Observe error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened under expected operation.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: Operating system, Rust version, and hardware target.
      placeholder: |
        - OS: Linux (Arch / Debian 12 / Ubuntu 24.04)
        - Rust version: rustc 1.97.1 (or output of `rustc --version`)
        - Target hardware: CPU / RAM / Disk (e.g. Intel i5-2400, 2 GB RAM, spinning HDD)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and Backtraces
      description: Relevant server or CLI logs. Scrub any sensitive keys or tokens before pasting.
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Prerequisites
      options:
        - label: I searched existing issues and verified this behavior is not already tracked.
          required: true
        - label: This issue does not contain private security vulnerabilities (report via SECURITY.md instead).
          required: true
