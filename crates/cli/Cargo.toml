[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { workspace = true, features = ["serde"] }
color-eyre = "0.6.5"
bincode-next = { workspace = true }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures.workspace = true
ratatui = { version = "0.30.2", features = ["widget-calendar"] }
textwrap = "0.16.2"
tokio = { workspace = true, features = ["time"] }
webdav-server = { path = "../server" }
