[package]
name = "webdav-server"
version = "0.1.1"
edition = "2024"
rust-version = "1.97.1"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[dependencies]
axum = "0.8.9"
blake3 = "1.8.5"
bytes = "1.11.1"
fs4 = { version = "1.1.0", features = ["tokio"] }
futures = { workspace = true }
hex = "0.4.3"
hyper = "1.10.1"
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
moka = { version = "0.12.15", features = ["future"] }
bincode-next = { workspace = true }
reqwest = { version = "0.13.4", features = ["json"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["chrono", "runtime-tokio", "sqlite", "tls-rustls", "uuid"] }
thiserror = "2.0.18"
uuid = { version = "1.23.3", features = ["serde", "v4"] }
chrono = { workspace = true }
dirs = { workspace = true }


[dev-dependencies]
anyhow = "1.0.102"
futures = "0.3.32"
httpc-test = { version = "0.1.10", features = ["color-output", "colored"] }
rand = "0.10.1"
reqwest = { version = "0.13.4", features = ["multipart"] }
serial_test = "3.5.0"
tmpdir = "1.0.0"
tower = "0.5.3"
