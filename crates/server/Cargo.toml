[package]
name = "webdav-server"
version = "0.1.3"
edition = "2024"
rust-version = "1.97.1"

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
blake3 = "1.8.5"
bytes = "1.11.1"
fs4 = { version = "1.1.0", features = ["tokio"] }
futures = { workspace = true }
hex = "0.4.3"
hyper = "1.10.1"
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
moka = { version = "0.12.15", features = ["future"] }
bincode-next = { workspace = true }
reqwest = { version = "0.13.4", features = ["json"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["chrono", "runtime-tokio", "sqlite", "tls-rustls", "uuid"] }
thiserror = "2.0.18"
uuid = { version = "1.23.3", features = ["serde", "v4"] }
chrono = { workspace = true }
dirs = { workspace = true }
serde_repr = "0.1.21"
rcgen = "0.14.10"
rustls = "0.23.45"
rustls-pemfile = "2.2.0"
sha2 = "0.11.0"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
knuffel = "3.2.0"
kosh-core = { path = "../core" }
miette = { version = "5.10.0", features = ["fancy"] }


[dev-dependencies]
futures = "0.3.32"
anyhow = { workspace = true }
http-body-util = "0.1.5"
httpc-test = { version = "0.1.10", features = ["color-output", "colored"] }
rand = "0.10.1"
reqwest = { version = "0.13.4", features = ["multipart"] }
serial_test = "3.5.0"
tmpdir = "1.0.0"
tower = "0.5.3"
