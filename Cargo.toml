[package]
name = "webdav-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
blake3 = "1.8.5"
bytes = "1.11.1"
chrono = { version = "0.4.45", features = ["serde"] }
fs4 = { version = "1.1.0", features = ["tokio"] }
futures = "0.3.32"
hex = "0.4.3"
hyper = "1.10.1"
rand = "0.10.1"
rcgen = "0.14.8"
reqwest = { version = "0.13.4", features = ["json"] }
serde = "1.0.228"
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["chrono", "runtime-tokio", "sqlite", "tls-rustls", "uuid"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["fs", "full", "macros", "net", "rt-multi-thread", "signal", "sync"] }
uuid = { version = "1.23.3", features = ["serde", "v4"] }

[dev-dependencies]
anyhow = "1.0.102"
futures = "0.3.32"
httpc-test = { version = "0.1.10", features = ["color-output", "colored"] }
rand = "0.10.1"
reqwest = { version = "0.13.4", features = ["multipart"] }
serial_test = "3.5.0"
tmpdir = "1.0.0"
