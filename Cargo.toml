
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "deny", priority = -1 }
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"


[workspace]
resolver = "2"
members = ["crates/cli", "crates/server"]


[workspace.dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.32"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.52.3", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-util = "0.7.19"
bincode-next = { version = "3.1.1" }
dirs = { version = "5.0" }
